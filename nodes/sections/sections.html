<script type="text/javascript">
	RED.nodes.registerType('mobilex-section', {
		category: 'mobileX Front',
		color: '#a6bbcf',
		icon: 'font-awesome/fa-cube',
		inputs: 1,
		outputs: 1,
		defaults: {
			tipo: {value: "html"},
			title: {value: ""},
			value: {value: ""},
			actionDefault: {value: 0},
		},
		label: function () {
			return this.title || "Mobilex Section";
		},
		outputLabels: function (index) {
			if (index === 0) return "Connecte Actions se necessário";
		},
	});
</script>

<script type="text/html" data-template-name="mobilex-section">
    <div class="form-row">
        <label for="node-input-tipo"><i class="fa fa-file"></i> Tipo</label>
        <select id="node-input-tipo">
            <option value="html">HTML</option>
            <option value="image">Imagem</option>
            <option value="audio">Áudio</option>
            <option value="gps">GPS</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-title"><i class="fa fa-header"></i> Título</label>
        <input type="text" id="node-input-title">
    </div>
    <div class="form-row">
        <label for="node-input-value"><i class="fa fa-pencil"></i> Valor</label>
        <input type="text" id="node-input-value">
    </div>
    <div class="form-row">
        <label for="node-input-actionDefault"><i class="fa fa-bolt"></i> Ação Default</label>
        <input type="number" id="node-input-actionDefault" min="0">
    </div>
</script>
